<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/css/style.css">
    <title>Faixa Verde | Entrar</title>
</head>
<body>
    <main class="container-login">
        <section class="container-login__conteudo">
            <div class="logo">
                <img class="logo__icone" src="./src/img/logo.png" alt="Logo Faixa Verde">
                <span class="logo__nome">Faixa Verde</span>
            </div>
            <h1 class="container-login__titulo">Entrar</h1>
            <p class="container-login__subtitulo">Veja seus percursos e troque seus pontos por cupons.</p>
            <form id="formulario-login" action="./percursos.html">
                <div class="campo">
                    <label class="campo__rotulo" for="campo-email">E-mail</label>
                    <input class="campo__entrada" id="campo-email" type="email" placeholder="marina@email.com">
                </div>
                <div class="campo">
                    <label class="campo__rotulo" for="campo-senha">Senha</label>
                    <input class="campo__entrada" id="campo-senha" type="password" placeholder="Sua senha">
                </div>
                <button class="botao-principal" id="botao-entrar" type="submit">Entrar</button>
            </form>
            <p class="container-login__rodape">
                Ainda não tem conta?
                <a href="#">Criar conta</a>
            </p>
        </section>
    </main>
</body>
</html>
